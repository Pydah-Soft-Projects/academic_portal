# ==============================================================================
# Academic Portal Nginx Configuration (HTTP / Initial Setup)
# Server location: /etc/nginx/conf.d/academic-portal.conf
#
# Frontend: acad.pydah.edu.in         -> Next.js on 127.0.0.1:3000
# Backend:  acad-backend.pydah.edu.in -> Express API on 127.0.0.1:4000
#
# After placing this file on the server, you can generate SSL with:
#   sudo certbot --nginx -d acad.pydah.edu.in -d acad-backend.pydah.edu.in
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Frontend (acad.pydah.edu.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name acad.pydah.edu.in;
    client_max_body_size 25M;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Next.js Frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional /api/ proxy fallback on frontend domain
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }
}

# ------------------------------------------------------------------------------
# 2. Backend API (acad-backend.pydah.edu.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name acad-backend.pydah.edu.in;
    client_max_body_size 25M;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Express Backend API
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
