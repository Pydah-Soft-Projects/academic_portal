# ==============================================================================
# Academic Portal Nginx Configuration
# Frontend: acad.pydah.edu.in         -> Next.js on 127.0.0.1:3000
# Backend:  acad-backend.pydah.edu.in -> Express API on 127.0.0.1:4000
# Server Location: /etc/nginx/conf.d/academic-portal.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Configuration (Port 80)
# Handles ACME challenge for Certbot and proxies traffic (or redirects to HTTPS)
# ------------------------------------------------------------------------------

# Frontend HTTP (acad.pydah.edu.in)
server {
    listen 80;
    listen [::]:80;
    server_name acad.pydah.edu.in;
    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS once SSL certificates are installed:
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Fallback /api/ route on frontend domain
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }
}

# Backend HTTP (acad-backend.pydah.edu.in)
server {
    listen 80;
    listen [::]:80;
    server_name acad-backend.pydah.edu.in;
    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS once SSL certificates are installed:
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Configuration (Port 443)
# Active when Let's Encrypt certificates exist under /etc/letsencrypt/live/
# ------------------------------------------------------------------------------

# Frontend HTTPS (acad.pydah.edu.in)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acad.pydah.edu.in;
    client_max_body_size 25M;

    ssl_certificate     /etc/letsencrypt/live/acad.pydah.edu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acad.pydah.edu.in/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Fallback /api/ route on frontend domain
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }
}

# Backend HTTPS (acad-backend.pydah.edu.in)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acad-backend.pydah.edu.in;
    client_max_body_size 25M;

    ssl_certificate     /etc/letsencrypt/live/acad-backend.pydah.edu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acad-backend.pydah.edu.in/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
